name: Mini Intel runtime validation

on:
  workflow_dispatch:
    inputs:
      producer_run:
        description: Successful ci/python-mini run with python-ios and python-mini artifacts
        required: true
        default: '39985582184'

permissions:
  contents: read
  actions: read

jobs:
  runtime:
    if: github.repository == 'demrom/cpython'
    runs-on: macos-26-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Verify producer and Intel runner
      env:
        GH_TOKEN: ${{ github.token }}
        PRODUCER_RUN: ${{ inputs.producer_run }}
      run: |
        test "$(uname -m)" = x86_64
        xcodebuild -version
        gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN" > "$RUNNER_TEMP/producer.json"
        jq -e '.conclusion == "success" and .head_branch == "ci/python-mini" and .head_sha == "fb086f726fe3dca49239717f7b48180998c36507"' "$RUNNER_TEMP/producer.json"
    - uses: actions/download-artifact@v8
      with:
        name: python-ios
        run-id: ${{ inputs.producer_run }}
        github-token: ${{ github.token }}
        path: .build/inputs/core
    - uses: actions/download-artifact@v8
      with:
        name: python-mini
        run-id: ${{ inputs.producer_run }}
        github-token: ${{ github.token }}
        path: .build/inputs/mini
    - name: Stage checksum-verified Simulator packages
      run: |
        (cd .build/inputs/core && shasum -a 256 -c checksums.txt)
        (cd .build/inputs/mini && shasum -a 256 -c mini-checksums.txt)
        consumer="$PWD/.build/consumer"
        mkdir -p "$consumer/Frameworks" "$consumer/Library/lib" "$consumer/unpacked"
        for archive in .build/inputs/{core,mini}/*.xcframework.zip; do
          unzip -q "$archive" -d "$consumer/unpacked"
          name=$(basename "$archive" .xcframework.zip)
          cp -R "$consumer/unpacked/$name.xcframework/ios-arm64_x86_64-simulator/$name.framework" "$consumer/Frameworks/"
        done
        for archive in .build/inputs/core/python-stdlib.tar.gz .build/inputs/mini/python-mini.tar.gz; do
          tar -xzf "$archive" -C "$consumer/unpacked"
        done
        cp -R "$consumer/unpacked/iphonesimulator/lib/" "$consumer/Library/lib/"
        curl -fL --retry 3 https://github.com/holzschu/ios_system/releases/download/v3.0.5/ios_system.xcframework.zip -o .build/inputs/ios_system.zip
        printf '%s  %s\n' d429e68102926f58bedd8e8b7105dcd169478cd6da1cef494a5f468482d1c8f5 .build/inputs/ios_system.zip | shasum -a 256 -c -
        unzip -q .build/inputs/ios_system.zip -d "$consumer/unpacked"
        cp -R "$consumer/unpacked/ios_system.xcframework/ios-arm64_x86_64-simulator/ios_system.framework" "$consumer/Frameworks/"
        nice -n 15 xcrun --sdk iphonesimulator clang -target x86_64-apple-ios14.0-simulator iOS/tests/science.c \
          -I"$consumer/Frameworks/Python.framework/Headers" -F"$consumer/Frameworks" \
          -framework Python -framework ios_system -o .build/mini-python-x86_64
        codesign --force --sign - .build/mini-python-x86_64
        lipo -verify_arch x86_64 .build/mini-python-x86_64
        file .build/mini-python-x86_64
    - name: Run public packaged fixture twice on x86_64 Simulator
      run: |
        mkdir -p .build/http
        printf 'mini-package-http\n' > .build/http/fixture.txt
        python3 -m http.server 18716 --bind 127.0.0.1 --directory .build/http > .build/http/server.log 2>&1 &
        http_pid=$!
        device=
        trap 'kill "$http_pid"; if [[ -n $device ]]; then xcrun simctl shutdown "$device"; xcrun simctl delete "$device"; fi' EXIT
        for _ in {1..30}; do
          if curl -fsS http://127.0.0.1:18716/fixture.txt > .build/http/readback.txt; then break; fi
          sleep 1
        done
        cmp .build/http/fixture.txt .build/http/readback.txt
        xcrun simctl list runtimes -j > .build/runtimes.json
        runtime=$(jq -r '[.runtimes[] | select(.isAvailable and (.identifier | contains("iOS")) and any(.supportedDeviceTypes[]?; .identifier == "com.apple.CoreSimulator.SimDeviceType.iPhone-17"))] | sort_by(.version | split(".") | map(tonumber)) | last.identifier // empty' .build/runtimes.json)
        test -n "$runtime"
        device=$(xcrun simctl create Mini-Intel com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$runtime")
        xcrun simctl boot "$device"
        xcrun simctl bootstatus "$device" -b
        consumer="$PWD/.build/consumer"
        result=0
        SIMCTL_CHILD_PYTHONHOME="$consumer/Library" \
        SIMCTL_CHILD_PYTHONPATH="$consumer/Library/lib/python3.13/site-packages" \
        SIMCTL_CHILD_APPDIR="$consumer" \
        SIMCTL_CHILD_DYLD_FRAMEWORK_PATH="$consumer/Frameworks" \
        SIMCTL_CHILD_MINI_TEST_URL=http://127.0.0.1:18716/fixture.txt \
          xcrun simctl spawn --arch=x86_64 "$device" "$PWD/.build/mini-python-x86_64" "$PWD/iOS/tests/mini.py" > .build/mini-runtime-x86_64.log 2>&1 || result=$?
        cat .build/mini-runtime-x86_64.log
        test "$result" = 0
        for line in "CFFI allocation PASS" "Crypto, Cryptodome and cryptography AES PASS" "lxml XSLT and regex overlap PASS" "curl_cffi HTTP PASS"; do
          test "$(grep -cxF "$line" .build/mini-runtime-x86_64.log)" = 2
        done
        grep -qx SCIENCE_REENTRY_PASSED .build/mini-runtime-x86_64.log
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: mini-intel-runtime
        if-no-files-found: error
        path: |
          .build/mini-runtime-x86_64.log
          .build/runtimes.json
          .build/http/server.log
