name: iOS frameworks

on:
  pull_request:
    paths-ignore:
    - '**.md'
    - '**.rst'
  workflow_dispatch:
  push:
    branches:
    - '3.13'
    tags:
    - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Build Python 3.13 for iOS and Simulator
      run: |
        brew install autoconf automake libtool cmake ninja openssl@3
        xcodebuild -version
        nice -n 15 bash scripts/build-ci-ios.sh
    - uses: actions/upload-artifact@v7
      with:
        name: python-ios
        if-no-files-found: error
        path: |
          .build/ci/dist/*.zip
          .build/ci/dist/python-stdlib.tar.gz
          .build/ci/dist/checksums.txt
          .build/ci/dist/release.md

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'holzschu/cpython'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: python-ios
        path: dist
    - name: Publish framework archives
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/*.zip dist/*.tar.gz dist/checksums.txt
        else
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
            --title "Release $GITHUB_REF_NAME" --notes-file dist/release.md dist/*.zip dist/*.tar.gz dist/checksums.txt
        fi
